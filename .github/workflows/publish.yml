name: Publish to RubyGems

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rubygems-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'CompanyEnrich/companyenrich-ruby-sdk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Test and lint
        run: bundle exec rake

      - name: Build the gem
        run: gem build --strict companyenrich.gemspec

      - name: Smoke-test the built gem
        run: |
          gem install --local --no-document ./companyenrich-*.gem
          cd "$RUNNER_TEMP"
          ruby -e 'require "companyenrich"; CompanyEnrich::Client.new(api_key: "smoke"); puts CompanyEnrich::VERSION'

      - name: Check whether this version needs publishing
        id: release
        run: |
          ruby - <<'RUBY'
          require "json"
          require "net/http"
          require "rubygems"

          spec = Gem::Specification.load("companyenrich.gemspec")
          version = spec.version
          abort "This workflow publishes stable companyenrich versions only." if spec.name != "companyenrich" || version.prerelease?

          response = Net::HTTP.get_response(URI("https://rubygems.org/api/v1/versions/companyenrich.json"))
          published =
            case response
            when Net::HTTPSuccess then JSON.parse(response.body).map { |release| Gem::Version.new(release.fetch("number")) }
            # A 404 means the gem has never been published.
            when Net::HTTPNotFound then []
            else abort "Cannot check RubyGems releases: HTTP #{response.code}."
            end

          exists = published.include?(version)
          latest = published.max
          abort "Version #{version} must be newer than RubyGems' latest #{latest}." if !exists && latest && version <= latest

          File.write(ENV.fetch("GITHUB_OUTPUT"), "publish=#{!exists}\n", mode: "a")
          message = exists ? "#{spec.name} #{version} is already published. Checks passed; publishing skipped." : "#{spec.name} #{version} is ready to publish."
          puts message
          File.write(ENV.fetch("GITHUB_STEP_SUMMARY"), "#{message}\n", mode: "a")
          RUBY

      - name: Store the built gem
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gem
          path: companyenrich-*.gem
          if-no-files-found: error

  # Runs separately so the API key is never present while dependencies are installed or tests run.
  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the built gem
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gem

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.4'

      - name: Publish to RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          if [ -z "$GEM_HOST_API_KEY" ]; then
            echo "::error::Set the RUBYGEMS_API_KEY repository secret to a RubyGems API key."
            exit 1
          fi
          # RubyGems' version list can lag behind a release made moments earlier.
          status=0
          output="$(gem push companyenrich-*.gem 2>&1)" || status=$?
          echo "$output"
          if grep -q 'Repushing of gem versions is not allowed' <<<"$output"; then
            echo "This version is already on RubyGems. Nothing to do."
            exit 0
          fi
          exit "$status"
